        <title>Shop Homepage - Start Bootstrap Template</title>
        <!-- Favicon-->

        <link href="assets/css/styles.css" rel="stylesheet" />

    <body>

        <nav class="navbar navbar-expand-lg navbar-light bg-beige">
            <div class="container">
